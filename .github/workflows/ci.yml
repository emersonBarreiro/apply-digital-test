name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: contentful_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test:cov
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/contentful_api_test
        CONTENTFUL_SPACE_ID: 9xs1613l9f7v
        CONTENTFUL_ACCESS_TOKEN: I-ThsT55eE_B3sCUWEQyDT4VqVO3x__20ufuie9usns
        CONTENTFUL_ENVIRONMENT: master
        CONTENTFUL_CONTENT_TYPE: product
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test

    - name: Check test coverage
      run: |
        COVERAGE=$(npm run test:cov 2>&1 | grep "All files" | awk '{print $4}' | sed 's/%//')
        echo "Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 30" | bc -l) )); then
          echo "Coverage $COVERAGE% is below required 30%"
          exit 1
        else
          echo "Coverage $COVERAGE% meets minimum requirement"
        fi

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/contentful_api_test
        CONTENTFUL_SPACE_ID: 9xs1613l9f7v
        CONTENTFUL_ACCESS_TOKEN: I-ThsT55eE_B3sCUWEQyDT4VqVO3x__20ufuie9usns
        CONTENTFUL_ENVIRONMENT: master
        CONTENTFUL_CONTENT_TYPE: product
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t contentful-api:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run --rm -d -p 3000:3000 --name test-app \
          -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
          -e JWT_SECRET=test-secret \
          contentful-api:${{ github.sha }}

        sleep 10

        # Test health endpoint
        docker exec test-app curl -f http://localhost:3000/health || exit 1

        docker stop test-app

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Check for known vulnerabilities
      run: npx audit-ci --moderate